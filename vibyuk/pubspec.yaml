name: vibyuk
description: VIBYUK — Create. Collaborate. Vibe. A B2B Creator & Event Booking Platform.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.19.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_bloc: ^8.1.5
  bloc: ^8.1.4
  equatable: ^2.0.5

  # Networking
  dio: ^5.4.3
  pretty_dio_logger: ^1.3.1

  # Routing
  go_router: ^13.2.1

  # Dependency Injection
  get_it: ^7.6.8
  injectable: ^2.3.2

  # Code Generation - Models
  freezed_annotation: ^2.4.1
  json_annotation: ^4.9.0

  # Local Storage
  flutter_secure_storage: ^9.0.0
  hive_flutter: ^1.1.0
  drift: ^2.18.0
  sqlite3_flutter_libs: ^0.5.0
  path_provider: ^2.1.3
  path: ^1.9.0

  # Firebase
  firebase_core: ^3.1.0
  firebase_messaging: ^15.0.3
  firebase_analytics: ^11.1.0

  # Utilities
  dartz: ^0.10.1
  logger: ^2.3.0
  connectivity_plus: ^6.0.3
  shared_preferences: ^2.2.3
  intl: ^0.19.0
  uuid: ^4.4.0
  rxdart: ^0.27.7
  collection: ^1.18.0
  flutter_animate: ^4.5.0
  cached_network_image: ^3.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.9
  freezed: ^2.5.2
  json_serializable: ^6.8.0
  injectable_generator: ^2.4.1
  drift_dev: ^2.18.0
  mocktail: ^1.0.2

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
        - asset: assets/fonts/Inter-ExtraBold.ttf
          weight: 800
